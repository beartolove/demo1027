<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIPC 案例 5-2｜AIS 軌跡</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link id="leafletCss" rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'"></script>
  <style>
    :root { --bg:#f5f8fb; --panel:rgba(255,255,255,.94); --ink:#102a43; --muted:#627d98; --line:#d9e2ec; --sea:#0d5d86; --accent:#f59e0b; --shadow:0 12px 32px rgba(16,42,67,.15); }
    body.dark { --bg:#08131f; --panel:rgba(12,28,43,.94); --ink:#e9f1f8; --muted:#9fb3c8; --line:#29445d; --sea:#42b6e8; --shadow:0 12px 32px rgba(0,0,0,.35); }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; overflow:hidden; font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    #map { position:fixed; inset:0; background:#bdd5e5; } body.dark #map { filter:saturate(.82) brightness(.76); }
    .topbar { position:fixed; z-index:1000; top:16px; left:16px; right:16px; display:flex; align-items:center; gap:12px; pointer-events:none; }
    .brand,.control-panel,.dropzone,.toast { background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); backdrop-filter:blur(10px); }
    .brand { padding:10px 15px; border-radius:12px; pointer-events:auto; min-width:205px; } .brand h1 { margin:0; font-size:16px; letter-spacing:.3px; } .brand p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .controls { margin-left:auto; display:flex; align-items:center; gap:8px; pointer-events:auto; } button,select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 11px; cursor:pointer; } button:hover,select:hover { border-color:var(--sea); } button.primary { color:#fff; background:var(--sea); border-color:var(--sea); font-weight:700; } button:disabled { opacity:.45; cursor:not-allowed; }
    .control-panel { position:fixed; z-index:1000; left:16px; bottom:16px; width:min(390px,calc(100vw - 32px)); border-radius:14px; padding:13px; } .time-readout { font-size:13px; font-weight:700; margin-bottom:9px; } .progress { width:100%; accent-color:var(--sea); } .row { display:flex; align-items:center; gap:8px; margin-top:10px; } .row label { color:var(--muted); font-size:12px; margin-right:auto; } .row select { padding:6px 8px; font-size:13px; }
    .ship-list { display:flex; flex-wrap:wrap; gap:6px; max-height:94px; overflow:auto; padding-top:9px; border-top:1px solid var(--line); margin-top:10px; } .ship-choice { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px; padding:5px 8px; cursor:pointer; font-size:12px; background:rgba(255,255,255,.35); } body.dark .ship-choice { background:rgba(0,0,0,.12); } .ship-choice input { accent-color:var(--sea); margin:0; } .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .dropzone { position:fixed; z-index:1001; top:50%; left:50%; transform:translate(-50%,-50%); width:min(440px,calc(100vw - 36px)); padding:30px; text-align:center; border:2px dashed var(--sea); border-radius:18px; cursor:pointer; transition:.2s; } .dropzone.drag { transform:translate(-50%,-50%) scale(1.025); background:var(--panel); } .dropzone h2 { margin:0 0 8px; font-size:20px; } .dropzone p { margin:0; color:var(--muted); font-size:13px; line-height:1.7; } .dropzone input { display:none; }
    .leaflet-popup-content-wrapper,.leaflet-popup-tip { background:var(--panel); color:var(--ink); } .leaflet-popup-content { margin:13px 15px; font-size:13px; line-height:1.65; } .popup-title { font-weight:800; font-size:15px; color:var(--sea); margin-bottom:5px; }.kv { display:grid; grid-template-columns:70px 1fr; gap:2px 8px; }.kv span:nth-child(odd){color:var(--muted)}
    .ship-marker { width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.35); display:grid; place-items:center; }.ship-marker i { transform:rotate(45deg); font-style:normal; font-size:13px; color:white; }
    .timestamp { width:11px; height:11px; border:2px solid #fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.4); }
    .leaflet-control-attribution { background:rgba(255,255,255,.78)!important; } body.dark .leaflet-control-attribution { color:#223!important; }
    .toast { position:fixed; z-index:1100; bottom:18px; left:50%; transform:translateX(-50%); border-radius:9px; padding:10px 14px; font-size:13px; display:none; }
    @media(max-width:650px){.topbar{top:8px;left:8px;right:8px}.brand{min-width:0;padding:8px 10px}.brand h1{font-size:13px}.brand p{display:none}.controls{gap:4px}.controls button,.controls select{padding:8px;font-size:12px}.control-panel{left:8px;bottom:8px;width:calc(100vw - 16px)}.dropzone{padding:24px 18px}}
  </style>
</head>
<body>
  <div id="map" aria-label="OpenStreetMap 船舶軌跡地圖"></div>
  <header class="topbar"><div class="brand"><h1>TIPC 案例 5-2｜AIS 軌跡</h1><p>Kaohsiung Harbor · Vessel playback</p></div><div class="controls"><button id="fitBtn" title="縮放到已選船舶範圍">定位範圍</button><button id="themeBtn" title="切換淺色或深色模式">深色模式</button></div></header>
  <section class="dropzone" id="dropzone" role="button" tabindex="0"><input id="fileInput" type="file" accept=".csv,text/csv"><h2>上傳 AIS 軌跡 CSV</h2><p>將檔案拖放到這裡，或點擊選取檔案。<br>需含 MMSI、SHIPNAME、LAT、LONG、Rdate 等欄位。</p></section>
  <section class="control-panel" id="player" hidden><div class="time-readout" id="timeReadout">—</div><input class="progress" id="timeline" type="range" min="0" max="0" value="0" step="1"><div class="row"><button class="primary" id="playBtn">▶ 播放</button><button id="backBtn" title="回到開始">↺</button><label for="speed">播放倍數</label><select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div><div class="ship-list" id="shipList"></div></section>
  <div class="toast" id="toast"></div>
  <script>
  (() => {
    if (!window.L) { document.getElementById('dropzone').innerHTML='<h2>地圖元件載入失敗</h2><p>請確認網路連線後重新開啟本頁。</p>'; return; }
    const $ = id => document.getElementById(id), palette=['#e45756','#009fb7','#f28f3b','#6c5ce7','#16a085','#d35400','#2c7fb8','#c0392b'];
    const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([22.616,120.286],12); L.control.zoom({position:'bottomright'}).addTo(map);
    // 兩組 HTTPS OSM 圖磚來源：主來源暫時無法取用時會自動切換備援。
    const tiles=[
      {url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',opts:{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}},
      {url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',opts:{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap contributors, Tiles style by HOT'}}
    ]; let tileIndex=0; let base=L.tileLayer(tiles[0].url,tiles[0].opts).addTo(map); let tileErrors=0;
    base.on('tileerror',()=>{ if(++tileErrors>=3 && tileIndex===0){ map.removeLayer(base); tileIndex=1; base=L.tileLayer(tiles[1].url,tiles[1].opts).addTo(map); showToast('已切換至備援 OpenStreetMap 圖資來源'); }});
    const state={ships:[],times:[],idx:0,playing:false,timer:null}; const layers=L.layerGroup().addTo(map);
    const csvRows=text=>{ const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/); const parse=line=>{let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++;}else q=!q;}else if(c===','&&!q){a.push(v.trim());v='';}else v+=c;}a.push(v.trim());return a;}; const headers=parse(lines.shift()).map(x=>x.toUpperCase()); return lines.filter(Boolean).map(l=>{let vals=parse(l),o={};headers.forEach((h,i)=>o[h]=vals[i]||'');return o;}); };
    const pick=(o,...names)=>{for(const n of names)if(o[n]!==undefined&&o[n]!=='')return o[n];return '';}; const dateValue=s=>{ const t=Date.parse(String(s).replace(/\//g,'-').replace(' ','T')); return Number.isNaN(t)?null:t; };
    function loadCsv(file){ const reader=new FileReader(); reader.onload=e=>{ try { const rows=csvRows(e.target.result).map(r=>({raw:r,mmsi:pick(r,'MMSI'),name:pick(r,'SHIPNAME','NAME','VESSELNAME')||'未命名船舶',lat:+pick(r,'LAT','LATITUDE'),lng:+pick(r,'LONG','LON','LNG','LONGITUDE'),time:dateValue(pick(r,'RDATE','TIMESTAMP','TIME','DATETIME')),sog:pick(r,'SOG'),cog:pick(r,'COG'),head:pick(r,'TRUEHEADIN','HEADING'),imo:pick(r,'IMO'),call:pick(r,'CALLSIGN'),type:pick(r,'SHIPTYPE'),length:pick(r,'LENGHT','LENGTH'),width:pick(r,'WINDTH','WIDTH'),draught:pick(r,'DRAUGHT'),destination:pick(r,'DESTINATIO','DESTINATION')})).filter(r=>r.mmsi&&Number.isFinite(r.lat)&&Number.isFinite(r.lng)&&r.time!==null); if(!rows.length) throw Error('找不到可用紀錄'); build(rows); } catch(err){ showToast('無法讀取 CSV：請確認欄位與檔案內容'); } }; reader.readAsText(file,'utf-8'); }
    function build(rows){ const by=new Map(); rows.forEach(r=>{if(!by.has(r.mmsi))by.set(r.mmsi,[]);by.get(r.mmsi).push(r);}); state.ships=[...by.values()].map((points,i)=>({id:points[0].mmsi,name:points[0].name,color:palette[i%palette.length],points:points.sort((a,b)=>a.time-b.time),selected:true})); state.times=[...new Set(rows.map(r=>r.time))].sort((a,b)=>a-b); state.idx=0; $('dropzone').hidden=true;$('player').hidden=false; renderList(); syncRange(); fitSelected(); render(); }
    function renderList(){ $('shipList').innerHTML=state.ships.map((s,i)=>`<label class="ship-choice" title="勾選後納入播放與縮放範圍"><input type="checkbox" data-i="${i}" ${s.selected?'checked':''}><i class="dot" style="background:${s.color}"></i>${escapeHTML(s.name)}</label>`).join(''); $('shipList').querySelectorAll('input').forEach(el=>el.onchange=()=>{state.ships[+el.dataset.i].selected=el.checked;pause();syncRange();fitSelected();render();}); }
    const escapeHTML=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function activeShips(){return state.ships.filter(s=>s.selected)} function pointAt(s,time){ let p=s.points[0]; for(const x of s.points){if(x.time>time)break;p=x;} return p; }
    function syncRange(){ const act=activeShips(); if(!act.length){$('timeline').max=0;$('timeline').value=0;return;} state.times=[...new Set(act.flatMap(s=>s.points.map(p=>p.time)))].sort((a,b)=>a-b); state.idx=Math.min(state.idx,Math.max(0,state.times.length-1)); $('timeline').max=Math.max(0,state.times.length-1); $('timeline').value=state.idx; }
    function render(){ layers.clearLayers(); const time=state.times[state.idx]; $('timeReadout').textContent=time?new Date(time).toLocaleString('zh-TW',{hour12:false}):'請至少選取一艘船舶'; if(!time)return; activeShips().forEach(s=>{ const shown=s.points.filter(p=>p.time<=time); if(!shown.length)return; const coords=shown.map(p=>[p.lat,p.lng]); L.polyline(coords,{color:s.color,weight:3,opacity:.88}).addTo(layers); shown.forEach((p,i)=>{ if(i===shown.length-1)return; L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="timestamp" style="background:${s.color}"></div>`,iconSize:[11,11],iconAnchor:[5,5]})}).bindTooltip(aisPopup(p),{direction:'top',offset:[0,-7],opacity:1,sticky:true}).addTo(layers); }); const p=shown.at(-1); const icon=L.divIcon({className:'',html:`<div class="ship-marker" style="background:${s.color};transform:rotate(${(+p.cog||0)-45}deg)"><i>⚓</i></div>`,iconSize:[30,30],iconAnchor:[15,15]}); L.marker([p.lat,p.lng],{icon}).bindPopup(shipPopup(s,p),{maxWidth:270}).addTo(layers); }); }
    function shipPopup(s,p){return `<div class="popup-title">⚓ ${escapeHTML(s.name)}</div><div class="kv"><span>MMSI</span><span>${escapeHTML(s.id)}</span><span>IMO</span><span>${escapeHTML(p.imo||'—')}</span><span>呼號</span><span>${escapeHTML(p.call||'—')}</span><span>船型</span><span>${escapeHTML(p.type||'—')}</span><span>尺寸</span><span>${escapeHTML(p.length||'—')} × ${escapeHTML(p.width||'—')} m</span><span>吃水</span><span>${escapeHTML(p.draught||'—')} m</span><span>目的地</span><span>${escapeHTML(p.destination||'—')}</span></div>`;}
    function aisPopup(p){return `<div class="popup-title">AIS 時間節點</div><div class="kv"><span>時間</span><span>${new Date(p.time).toLocaleString('zh-TW',{hour12:false})}</span><span>位置</span><span>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span><span>航速</span><span>${escapeHTML(p.sog||'—')} kn</span><span>航向</span><span>${escapeHTML(p.cog||'—')}°</span><span>船艏向</span><span>${escapeHTML(p.head||'—')}°</span></div>`;}
    function fitSelected(){const pts=activeShips().flatMap(s=>s.points.map(p=>[p.lat,p.lng]));if(pts.length)map.fitBounds(pts,{padding:[55,55],maxZoom:15});}
    function pause(){state.playing=false;clearInterval(state.timer);$('playBtn').textContent='▶ 播放';} function togglePlay(){if(!state.times.length)return;if(state.playing){pause();return;}state.playing=true;$('playBtn').textContent='❚❚ 暫停';const tick=()=>{if(state.idx>=state.times.length-1){pause();return;}state.idx++;$('timeline').value=state.idx;render();};state.timer=setInterval(tick,Math.round(750/+$('speed').value));}
    $('playBtn').onclick=togglePlay;$('backBtn').onclick=()=>{pause();state.idx=0;$('timeline').value=0;render();};$('timeline').oninput=e=>{pause();state.idx=+e.target.value;render();};$('speed').onchange=()=>{if(state.playing){pause();togglePlay();}};$('fitBtn').onclick=fitSelected;$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('themeBtn').textContent=document.body.classList.contains('dark')?'淺色模式':'深色模式';};
    const dz=$('dropzone'); ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadCsv(f)});dz.onclick=()=>$('fileInput').click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('fileInput').click();};$('fileInput').onchange=e=>{if(e.target.files[0])loadCsv(e.target.files[0]);};
    function showToast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500);}
    if(location.protocol==='file:') showToast('請使用「啟動 AIS 軌跡網站.bat」開啟，以確保地圖能穩定載入。');
  })();
  </script>
</body>
</html>
